<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Imagen para compartir el enlace (1200 × 630)</title>
<style>
  @font-face { font-family: "Fraunces"; src: url("../assets/fuentes/fraunces-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
  @font-face { font-family: "Fraunces"; src: url("../assets/fuentes/fraunces-latin-wght-italic.woff2") format("woff2"); font-weight: 100 900; font-style: italic; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; position: relative; overflow: hidden; background: #f5f2ea; color: #16181d; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  .marca { position: absolute; left: 72px; top: 66px; display: flex; align-items: center; gap: 24px; }
  .marca img { width: 68px; height: 68px; border-radius: 14px; }
  .marca span { font-family: "Fraunces", Georgia, serif; font-weight: 650; font-size: 46px; letter-spacing: -0.02em; }
  .etiqueta { position: absolute; left: 72px; top: 158px; display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #5a5e67; }
  .etiqueta::before { content: ""; width: 26px; height: 3px; background: #f2a20c; }
  h1 { position: absolute; left: 72px; top: 214px; font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 80px; line-height: 1.05; letter-spacing: -0.02em; }
  h1 em { display: block; font-style: italic; font-weight: 600; color: #1b4fd8; }
  .texto { position: absolute; left: 72px; top: 438px; width: 560px; font-size: 27px; line-height: 1.5; color: #5a5e67; }
  .regla { position: absolute; left: 72px; right: 72px; top: 574px; height: 3px; background: #16181d; }
  .bloque { position: absolute; left: 712px; top: 262px; width: 441px; height: 276px; background: #1b4fd8; }
  .circulo { position: absolute; left: 1118px; top: 220px; width: 44px; height: 44px; border-radius: 50%; background: #f2a20c; }
  .captura { position: absolute; left: 690px; top: 240px; width: 441px; height: 276px; border: 1px solid #b9b29f; background: #fbf9f4; overflow: hidden; box-shadow: 0 1px 0 rgba(22, 24, 29, 0.06), 0 28px 50px -30px rgba(40, 34, 10, 0.45); }
  .captura img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top left; }
</style>
</head>
<body>
  <div class="marca"><img src="../assets/icono/nexo-512.png" alt=""><span>Nexo</span></div>
  <div class="etiqueta">Para Windows y Linux</div>
  <h1>Tu carrera,<em>en un solo lugar.</em></h1>
  <p class="texto">Horario, calendario, tareas, documentos, repaso, música y video. Gratis por ahora.</p>
  <div class="regla"></div>
  <div class="bloque"></div>
  <div class="circulo"></div>
  <div class="captura"><img src="../assets/capturas/inicio-claro.webp" alt=""></div>
</body>
</html>
