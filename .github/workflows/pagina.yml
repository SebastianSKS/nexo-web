name: Publicar la página

# Publica en GitHub Pages (Settings › Pages › Source: GitHub Actions) en cada cambio en main, o a mano desde Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar
        run: node tools/comprobar.mjs
      - name: Dejar solo lo que se publica
        run: |
          mkdir -p _sitio
          cp -r index.html 404.html css app.js robots.txt sitemap.xml site.webmanifest .nojekyll assets _sitio/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
