name: Publicar la página

# Se lanza a mano (Actions › Publicar la página › Run workflow) una vez activado Settings › Pages › Source: GitHub Actions.
# Para que se publique solo en cada cambio, añade «push: branches: [main]» bajo «on:».
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar
        run: node tools/comprobar.mjs
      - name: Dejar solo lo que se publica
        run: |
          mkdir -p _sitio
          cp -r index.html 404.html styles.css app.js robots.txt .nojekyll assets _sitio/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
